<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  background:radial-gradient(circle at top,#542b38,#180d12 70%);
  color:#fff; font-family:Georgia,serif;
}
.card{width:min(390px,92vw); text-align:center; padding:35px 24px}
.rose{font-size:42px; margin-bottom:12px}
h1{font-size:28px;margin:8px 0 10px}
.sub{opacity:.72;font-family:Arial,sans-serif;font-size:14px}
.pin{font-family:Arial,sans-serif; margin:22px auto; display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px}
button{
  border:0;border-radius:13px;padding:18px 8px;font-size:20px;
  background:rgba(255,255,255,.08);color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
button:active{transform:scale(.96)}
.display{font-family:Arial,sans-serif;letter-spacing:7px;min-height:25px;color:#f2cbd4}
.error{height:20px;color:#ff9fb1;font:13px Arial}
.hidden{display:none}
.surprise h2{font-size:30px;margin-bottom:10px}
.photo{
  width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:20px;
  margin:20px 0; background:#2a171e;
}
.message{
  font-family:Arial,sans-serif;line-height:1.7;color:#f8e9ed;
  background:rgba(255,255,255,.06);padding:20px;border-radius:18px;text-align:left;
}
.back{margin-top:18px;font-size:13px;padding:10px 18px}
</style>
</head>
<body>

<div class="card" id="login">
  <div class="rose">🌹</div>
  <h1>For You, <span id="name1">Nama</span></h1>
  <div class="sub">Enter the secret code</div>
  <div class="display" id="display"></div>
  <div class="pin">
    <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button>
    <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button>
    <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button>
    <button onclick="clearPin()">×</button><button onclick="press('0')">0</button><button onclick="checkPin()">↵</button>
  </div>
  <div class="error" id="error"></div>
</div>

<div class="card surprise hidden" id="surprise">
  <div class="rose">🌹</div>
  <h2>Happy Birthday, <span id="name2">Nama</span> ❤️</h2>
  <div class="sub">A little surprise just for you</div>
  <img class="photo" id="photo" src="photo.jpg" alt="Birthday photo">
  <div class="message" id="message">
    Selamat hari lahir sayang ❤️<br><br>
    Semoga hari istimewa ini dipenuhi dengan kebahagiaan, rezeki,
    kesihatan dan semua perkara yang awak impikan.
    Terima kasih sebab hadir dalam hidup saya. 🥰
  </div>
  <button class="back" onclick="location.reload()">Replay</button>
</div>

<script>
// =========================
// UBAH 3 BAHAGIAN INI SAHAJA
// =========================
const RECIPIENT = "Siti Aisyah💞";       // Contoh: "Aisyah"
const SECRET_CODE = "020902";   // Contoh: "020902"
const PHOTO_FILE = "photo.jpg"; // Nama fail gambar dalam folder yang sama

// Ubah ucapan di bahagian HTML #message jika mahu.

document.getElementById("name1").textContent = RECIPIENT;
document.getElementById("name2").textContent = RECIPIENT;
document.getElementById("photo").src = PHOTO_FILE;

let pin="";
function press(n){
  if(pin.length < 12) pin += n;
  document.getElementById("display").textContent = "•".repeat(pin.length);
}
function clearPin(){
  pin="";
  document.getElementById("display").textContent="";
  document.getElementById("error").textContent="";
}
function checkPin(){
  if(pin === SECRET_CODE){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("surprise").classList.remove("hidden");
  }else{
    document.getElementById("error").textContent="Code salah 😜 Cuba lagi.";
    pin="";
    document.getElementById("display").textContent="";
  }
}
</script>
</body>
</html>
